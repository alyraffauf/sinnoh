apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pocket-id
  annotations:
    helm.sh/resource-policy: keep
spec:
  secretName: {{ .Values.certificate.secretName }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.certificate.clusterIssuer }}
  dnsNames:
    {{- toYaml .Values.hosts | nindent 4 }}
