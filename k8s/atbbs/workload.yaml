apiVersion: apps/v1
kind: Deployment
metadata:
  name: atbbs-telnet
  namespace: atbbs
  labels:
    app: atbbs-telnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atbbs-telnet
  template:
    metadata:
      labels:
        app: atbbs-telnet
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: atbbs-telnet
          image: ghcr.io/alyraffauf/atbbs-telnet:latest@sha256:548a7a42d37ebfa56d8a2ec88f8c8748b5685036e9f4a959a0ca681d2bcbdc78
          ports:
            - name: telnet
              containerPort: 2323
          readinessProbe:
            tcpSocket:
              port: telnet
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: atbbs-telnet
  namespace: atbbs
spec:
  selector:
    app: atbbs-telnet
  ports:
    - name: telnet
      port: 2323
      targetPort: telnet
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: atbbs-telnet
  namespace: atbbs
spec:
  entryPoints:
    - telnet
  routes:
    - match: HostSNI(`*`)
      services:
        - name: atbbs-telnet
          port: 2323

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atbbs-web
  namespace: atbbs
  labels:
    app: atbbs-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atbbs-web
  template:
    metadata:
      labels:
        app: atbbs-web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: atbbs-web
      containers:
        - name: atbbs-web
          image: ghcr.io/alyraffauf/atbbs:latest@sha256:4bc64ddffa9fc656c08df3d14f62dc9f533dea98f794e65661a42f331831fc9f
          env:
            - name: PUBLIC_URL
              value: https://atbbs.aly.town
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: atbbs-web
  namespace: atbbs
spec:
  selector:
    app: atbbs-web
  ports:
    - name: http
      port: 80
      targetPort: http
