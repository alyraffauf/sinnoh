apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacifico
  namespace: tranquil-pds
  labels:
    app: pacifico
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pacifico
  template:
    metadata:
      labels:
        app: pacifico
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pacifico
      containers:
        - name: pacifico
          image: ghcr.io/alyraffauf/pacifico:d4cb405c47cc991003a4744afea6a6817824c46e@sha256:44220531a740d95b8afc07d1d9ba78b6be7a61e6a3e13bb295176ea5131af035
          env:
            - name: PUBLIC_ORIGIN
              value: https://aly.social
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pacifico
  namespace: tranquil-pds
spec:
  selector:
    app: pacifico
  ports:
    - name: http
      port: 80
      targetPort: http
