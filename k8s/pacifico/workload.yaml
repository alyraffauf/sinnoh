apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacifico
  namespace: tranquil-pds
  labels:
    app: pacifico
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pacifico
  template:
    metadata:
      labels:
        app: pacifico
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pacifico
      containers:
        - name: pacifico
          image: ghcr.io/alyraffauf/pacifico:latest@sha256:b825bebe8c59acd55ea448adfbdd9641a2548b647fa4e910dd86327ee567db35
          env:
            - name: PUBLIC_ORIGIN
              value: https://aly.social
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pacifico
  namespace: tranquil-pds
spec:
  selector:
    app: pacifico
  ports:
    - name: http
      port: 80
      targetPort: http
