apiVersion: apps/v1
kind: Deployment
metadata:
  name: morgan
  namespace: morgan
  labels:
    app: morgan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: morgan
  template:
    metadata:
      labels:
        app: morgan
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: morgan
      containers:
        - name: morgan
          image: ghcr.io/alyraffauf/morgantamayo.com:latest@sha256:ae629748512aa81d45c6d1680a3c6e54f4270bca88d6d5cd5bcb86c672286971
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: morgan
  namespace: morgan
spec:
  selector:
    app: morgan
  ports:
    - name: http
      port: 80
      targetPort: http
